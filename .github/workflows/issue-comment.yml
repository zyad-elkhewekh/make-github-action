name: github-act-comment

on:
  issue_comment:
    types: [created]

jobs:
  first-job:
    if: github.event.issue.numer == 1
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: start
        uses: actions/checkout@v6

      - name: send result
        run: |
          chmod +x grade-sol.sh
          ./grade-sol.sh
          bash result.sh

      - name: commit and push result
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Result.md
          git commit -m "Grading"
          git push
